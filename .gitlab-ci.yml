workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - publish

.code_changes: &code_changes
  - cmd/**/*
  - config/**/*
  - internal/**/*
  - web/**/*
  - Dockerfile
  - go.mod
  - go.sum
  - VERSION
  - .gitlab-ci.yml

.derive_version: &derive_version
  export VERSION=${CI_COMMIT_TAG:-$(cat VERSION)-$CI_COMMIT_SHORT_SHA}

.rules_test:
  rules:
    - changes: *code_changes

.rules_build:
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      changes: *code_changes

.rules_publish:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code_changes

test:
  extends: .rules_test
  stage: test
  image: golang:1.27-alpine
  tags:
    - docker
  script:
    - go vet ./...
    - go install gotest.tools/gotestsum@v1.13.0
    - gotestsum --junitfile report.xml -- ./...
  artifacts:
    reports:
      junit: report.xml
    when: always

build:
  extends: .rules_build
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - docker
  script:
    - *derive_version
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --build-arg TARGETOS=linux
        --build-arg TARGETARCH=amd64
        --build-arg VERSION=$VERSION
        --no-push

.publish_arch:
  extends: .rules_publish
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

publish:amd64:
  extends: .publish_arch
  tags:
    - docker
    - amd64
  script:
    - *derive_version
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --build-arg TARGETOS=linux
        --build-arg TARGETARCH=amd64
        --build-arg VERSION=$VERSION
        --destination "$CI_REGISTRY_IMAGE:$VERSION-amd64"

publish:arm64:
  extends: .publish_arch
  tags:
    - docker
    - arm64
  script:
    - *derive_version
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --build-arg TARGETOS=linux
        --build-arg TARGETARCH=arm64
        --build-arg VERSION=$VERSION
        --destination "$CI_REGISTRY_IMAGE:$VERSION-arm64"

publish:manifest:
  extends: .rules_publish
  stage: publish
  image:
    name: mplatform/manifest-tool:alpine
    entrypoint: [""]
  tags:
    - docker
  needs:
    - publish:amd64
    - publish:arm64
  script:
    - *derive_version
    - manifest-tool
        --username "$CI_REGISTRY_USER"
        --password "$CI_REGISTRY_PASSWORD"
        push from-args
        --platforms linux/amd64,linux/arm64
        --template "$CI_REGISTRY_IMAGE:$VERSION-ARCH"
        --target "$CI_REGISTRY_IMAGE:$VERSION"
    - manifest-tool
        --username "$CI_REGISTRY_USER"
        --password "$CI_REGISTRY_PASSWORD"
        push from-args
        --platforms linux/amd64,linux/arm64
        --template "$CI_REGISTRY_IMAGE:$VERSION-ARCH"
        --target "$CI_REGISTRY_IMAGE:latest"
