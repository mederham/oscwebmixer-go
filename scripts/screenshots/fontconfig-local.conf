<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The app's CSS asks for -apple-system, system-ui, sans-serif (Apple's SF
  Pro on a real device). SF Pro isn't redistributable via apt, so alias
  those names to Inter (installed via fonts-inter) as a free, metrically
  close stand-in — closer to real-device screenshots than the container's
  default DejaVu Sans fallback.
-->
<fontconfig>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
